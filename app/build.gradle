plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.piplifefx.bot"
    compileSdk 35

    defaultConfig {
        applicationId "com.piplifefx.bot"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
    }
}
